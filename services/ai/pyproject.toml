[project]
name = "ai-lawyer-kz-ai"
version = "0.1.0"
description = "AI/RAG orchestration service for AI-Юрист Казахстан"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0"
]

[project.optional-dependencies]
dev = [
  "httpx2>=0.28.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "mypy>=1.17.0"
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
