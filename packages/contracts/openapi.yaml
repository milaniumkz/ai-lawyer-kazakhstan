components:
  schemas:
    TaskCreate:
      type: object
      required: [title, dueDate]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        dueDate: {type: string, format: date}
        caseId: {type: string, format: uuid}
    TaskUpdate:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [pending, completed]}
    UserTask:
      allOf:
        - $ref: "#/components/schemas/TaskCreate"
        - type: object
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [pending, completed]}
            basis: {type: string, enum: [user_defined]}
    DeleteResult:
      type: object
      properties:
        deleted: {type: boolean}
    DispatchCreate:
      type: object
      required: [method, contact]
      properties:
        method: {type: string, enum: [email, whatsapp, sms, post]}
        contact: {type: string, maxLength: 300}
        message: {type: string, maxLength: 20000}
        status: {type: string, enum: [draft, manual_sent_unverified]}
        confirmed: {type: boolean}
    DispatchRecord:
      allOf:
        - $ref: "#/components/schemas/DispatchCreate"
        - type: object
          properties:
            id: {type: string, format: uuid}
            documentId: {type: string, format: uuid}
            confirmedAt: {type: string, format: date-time}
    SupportCreate:
      type: object
      required: [topic, text]
      properties:
        topic: {type: string, minLength: 1, maxLength: 100}
        text: {type: string, minLength: 8, maxLength: 20000}
    SupportTicket:
      allOf:
        - $ref: "#/components/schemas/SupportCreate"
        - type: object
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [open, resolved]}
            reply: {type: string}
            repliedAt: {type: string, format: date-time}
            createdAt: {type: string, format: date-time}

    GenerationJob:
      type: object
      required: [id, caseId, status, stage, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed, cancelled, failed]}
        stage: {type: string, enum: [queued, rendering, completed, cancelled, failed]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        error: {type: string}
        document:
          $ref: "#/components/schemas/GeneratedDocument"

    HealthResponse:
      type: object
      required: [status, service, jurisdiction]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        jurisdiction:
          type: string
          enum: [KZ]
    RegisterRequest:
      type: object
      required: [channel, consentVersion]
      properties:
        channel:
          type: string
          enum: [phone, email]
        phone:
          type: string
          pattern: "^\\+7\\d{10}$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        consentVersion:
          type: string
    OtpChallenge:
      type: object
      required: [otpId, expiresAt, deliveryMode]
      properties:
        otpId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        deliveryMode:
          type: string
          enum: [stub, sms, email]
        testCode:
          type: string
          description: Present only in local/stub mode.
    VerifyOtpRequest:
      type: object
      required: [otpId, code]
      properties:
        otpId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 6
          maxLength: 6
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthUser:
      type: object
      required: [id, roles, consentVersion]
      properties:
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [guest, user, legal_expert, support_operator, admin, superadmin]
        consentVersion:
          type: string
    AccountExport:
      type: object
      required: [exportedAt, user, profiles, sessions]
      properties:
        exportedAt:
          type: string
          format: date-time
        user:
          type: object
          required: [id, channel, roles, consentVersion, createdAt]
          properties:
            id:
              type: string
              format: uuid
            channel:
              type: string
              enum: [phone, email]
            phone:
              type: string
            email:
              type: string
            roles:
              type: array
              items:
                type: string
            consentVersion:
              type: string
            createdAt:
              type: string
              format: date-time
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    DeleteAccountResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    Session:
      type: object
      required: [id, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
