openapi: 3.1.0
info:
  title: AI-Юрист Казахстан API
  version: 0.1.0
  description: REST contract for AI-Юрист Казахстан.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: API health check
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/register:
    post:
      operationId: register
      summary: Start phone or email registration with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: OTP request created in configured delivery mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify OTP and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "201":
          description: Auth token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      operationId: login
      summary: Login with phone or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Auth token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "201":
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all user sessions
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
  /account/export:
    get:
      operationId: exportAccount
      summary: Export current user's account data without secrets
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account export with sessions and masked profile identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
  /account:
    delete:
      operationId: deleteAccount
      summary: Delete current user's account and revoke sessions
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResponse"
  /sessions:
    get:
      operationId: listSessions
      summary: List current user's sessions
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sessions without refresh token values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
  /profiles:
    get:
      operationId: listProfiles
      summary: List profiles for current user
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profiles with masked IIN/BIN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      summary: Create person/IP/legal entity/representative profile
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Created profile with masked IIN/BIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List recent audit events
      parameters:
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "200":
          description: Recent audit events without secrets or raw IIN/BIN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /admin/legal-categories:
    get:
      operationId: adminListLegalCategoryTree
      summary: Admin list legal categories as a review tree
      parameters:
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "200":
          description: Admin legal category tree
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/LegalCategory"
                    - type: object
                      properties:
                        children:
                          type: array
                          items:
                            $ref: "#/components/schemas/LegalCategory"
  /admin/legal-categories/change-requests:
    get:
      operationId: adminListLegalCategoryChangeRequests
      summary: List legal category change requests
      parameters:
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "200":
          description: Legal category change requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalCategoryChangeRequest"
    post:
      operationId: adminCreateLegalCategoryChangeRequest
      summary: Create a safe legal category change request
      parameters:
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLegalCategoryChangeRequest"
      responses:
        "201":
          description: Created pending change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCategoryChangeRequest"
  /admin/legal-categories/change-requests/{id}:
    get:
      operationId: adminGetLegalCategoryChangeRequest
      summary: Get legal category change request details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "200":
          description: Legal category change request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCategoryChangeRequest"
  /admin/legal-categories/change-requests/{id}/approve:
    post:
      operationId: adminApproveLegalCategoryChangeRequest
      summary: Approve and apply a legal category change request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "201":
          description: Approved change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCategoryChangeRequest"
  /admin/legal-categories/change-requests/{id}/reject:
    post:
      operationId: adminRejectLegalCategoryChangeRequest
      summary: Reject a legal category change request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "201":
          description: Rejected change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCategoryChangeRequest"
  /admin/classifications/review-queue:
    get:
      operationId: adminClassificationReviewQueue
      summary: Admin review queue for unconfirmed, high-risk or incomplete classifications
      parameters:
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "200":
          description: Classification records requiring admin or expert review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseClassificationRecord"
  /admin/classifications/{id}/confirm:
    post:
      operationId: adminConfirmClassification
      summary: Admin confirms a classification after review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "201":
          description: Confirmed classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /admin/classifications/{id}/override:
    post:
      operationId: adminOverrideClassification
      summary: Admin or expert corrects a classification and records expert feedback
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subcategoryCode]
              properties:
                subcategoryCode:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Expert-corrected classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /cases:
    get:
      operationId: listCases
      summary: List cases owned by current user
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Legal cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalCase"
    post:
      operationId: createCase
      summary: Create a legal case from confirmed text
      parameters:
        - in: header
          name: idempotency-key
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
  /case-categories:
    get:
      operationId: listCaseCategories
      summary: List Kazakhstan case classification categories
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Case classification taxonomy with criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseCategory"
  /legal-categories:
    get:
      operationId: listLegalCategories
      summary: List database-backed Kazakhstan legal categories
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Legal category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalCategory"
  /legal-categories/tree:
    get:
      operationId: listLegalCategoryTree
      summary: List legal categories as a tree
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Legal category tree
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/LegalCategory"
                    - type: object
                      properties:
                        children:
                          type: array
                          items:
                            $ref: "#/components/schemas/LegalCategory"
  /cases/{caseId}:
    get:
      operationId: getCase
      summary: Get case by id
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Legal case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
  /cases/{caseId}/classification:
    get:
      operationId: getCaseClassification
      summary: Get latest classification for a case
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Case classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /ai/classifications:
    post:
      operationId: createClassification
      summary: Classify confirmed voice or text into an allowed KZ dispute category
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassificationRequest"
      responses:
        "201":
          description: Classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /ai/classifications/{id}:
    get:
      operationId: getClassification
      summary: Get classification by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /ai/classifications/{id}/clarifications:
    post:
      operationId: answerClassificationClarifications
      summary: Save answers to category clarification questions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
      responses:
        "201":
          description: Updated classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /ai/classifications/{id}/confirm:
    post:
      operationId: confirmClassification
      summary: Confirm proposed classification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: idempotency-key
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Confirmed classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /ai/classifications/{id}/override:
    post:
      operationId: overrideClassification
      summary: Manually override classification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subcategoryCode]
              properties:
                subcategoryCode:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Updated classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseClassificationRecord"
  /cases/{caseId}/messages:
    get:
      operationId: listMessages
      summary: List case messages
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: addMessage
      summary: Add message to case chat
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: idempotency-key
          required: false
          schema: {type: string, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /voice/transcripts:
    post:
      operationId: createTranscript
      summary: Create local/stub transcript job
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTranscriptRequest"
      responses:
        "201":
          description: Transcript job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptJob"
  /voice/transcripts/audio:
    post:
      operationId: createAudioTranscript
      summary: Upload real audio and create transcript job
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                caseId:
                  type: string
                language:
                  type: string
                  enum: [ru, kk, en]
                text:
                  type: string
      responses:
        "201":
          description: Transcript job with stored audio metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptJob"
  /voice/transcripts/{id}:
    get:
      operationId: getTranscript
      summary: Get transcript job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transcript job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptJob"
  /files/upload-sessions:
    post:
      operationId: createUploadSession
      summary: Create authenticated upload session
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: Upload session with authenticated content URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
  /files/uploads/{token}/content:
    post:
      operationId: uploadFileContent
      summary: Store validated file bytes before completion
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
        - in: header
          name: x-user-id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: x-upload-session-id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Validated SHA-256 and byte count
  /documents/{documentId}/content:
    get:
      operationId: downloadFileContent
      summary: Download original bytes of an owned document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: x-user-id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Original document as an attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /files/complete:
    post:
      operationId: completeUpload
      summary: Complete upload and create document metadata
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadSessionId]
              properties:
                uploadSessionId:
                  type: string
                sha256:
                  type: string
      responses:
        "201":
          description: Document requiring OCR review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /cases/{caseId}/documents:
    get:
      operationId: listDocuments
      summary: List case documents
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Case documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
  /documents/{documentId}/ocr-confirm:
    post:
      operationId: confirmOcr
      summary: Confirm user-reviewed OCR fields
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          description: Ready document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /admin/documents/review-queue:
    get:
      operationId: adminDocumentReviewQueue
      summary: Admin document OCR and failed processing review queue
      parameters:
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      responses:
        "200":
          description: Documents requiring admin review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
  /admin/documents/{documentId}/ocr-confirm:
    post:
      operationId: adminConfirmOcr
      summary: Admin confirms OCR fields and marks document ready
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
        - in: header
          name: x-user-role
          required: true
          schema:
            type: string
            enum: [admin, superadmin]
      requestBody:
