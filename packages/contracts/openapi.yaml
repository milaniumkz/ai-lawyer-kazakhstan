openapi: 3.1.0
info:
  title: AI-Юрист Казахстан API
  version: 0.1.0
  description: REST contract for AI-Юрист Казахстан.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: API health check
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/register:
    post:
      operationId: register
      summary: Start phone or email registration with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: OTP request created in configured delivery mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify OTP and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "201":
          description: Auth token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      operationId: login
      summary: Login with phone or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Auth token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "201":
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all user sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
  /sessions:
    get:
      operationId: listSessions
      summary: List current user's sessions
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
      responses:
        "200":
          description: Sessions without refresh token values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
  /profiles:
    get:
      operationId: listProfiles
      summary: List profiles for current user
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
      responses:
        "200":
          description: User profiles with masked IIN/BIN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      summary: Create person/IP/legal entity/representative profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Created profile with masked IIN/BIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List recent audit events
      responses:
        "200":
          description: Recent audit events without secrets or raw IIN/BIN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /cases:
    get:
      operationId: listCases
      summary: List cases owned by current user
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
      responses:
        "200":
          description: Legal cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalCase"
    post:
      operationId: createCase
      summary: Create a legal case from confirmed text
      parameters:
        - in: header
          name: idempotency-key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
  /cases/{caseId}:
    get:
      operationId: getCase
      summary: Get case by id
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Legal case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
  /cases/{caseId}/messages:
    get:
      operationId: listMessages
      summary: List case messages
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: addMessage
      summary: Add message to case chat
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /voice/transcripts:
    post:
      operationId: createTranscript
      summary: Create local/stub transcript job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTranscriptRequest"
      responses:
        "201":
          description: Transcript job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptJob"
  /voice/transcripts/audio:
    post:
      operationId: createAudioTranscript
      summary: Upload real audio and create transcript job
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                caseId:
                  type: string
                language:
                  type: string
                  enum: [ru, kk, en]
                text:
                  type: string
      responses:
        "201":
          description: Transcript job with stored audio metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptJob"
  /voice/transcripts/{id}:
    get:
      operationId: getTranscript
      summary: Get transcript job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transcript job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptJob"
  /files/upload-sessions:
    post:
      operationId: createUploadSession
      summary: Create secure upload session metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: Upload session with short-lived stub URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
  /files/complete:
    post:
      operationId: completeUpload
      summary: Complete upload and create document metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadSessionId]
              properties:
                uploadSessionId:
                  type: string
                sha256:
                  type: string
      responses:
        "201":
          description: Document requiring OCR review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /cases/{caseId}/documents:
    get:
      operationId: listDocuments
      summary: List case documents
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
  /documents/{documentId}/ocr-confirm:
    post:
      operationId: confirmOcr
      summary: Confirm user-reviewed OCR fields
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          description: Ready document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /evidence:
    post:
      operationId: createEvidenceFolder
      summary: Create evidence folder with preliminary assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceFolderRequest"
      responses:
        "201":
          description: Evidence folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceFolder"
  /cases/{caseId}/evidence:
    get:
      operationId: listEvidence
      summary: List case evidence folders
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceFolder"
  /legal-sources/manual-import:
    post:
      operationId: manualImportLegalSource
      summary: Manually import an official KZ legal source fragment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualLegalSourceImport"
      responses:
        "201":
          description: Imported source fragment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalSourceFragment"
  /legal-search:
    get:
      operationId: legalSearch
      summary: Search imported official KZ legal fragments
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: Matching active fragments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalSourceFragment"
  /citations/validate:
    post:
      operationId: validateCitation
      summary: Validate citation against official KZ source fragment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitationValidationRequest"
      responses:
        "201":
          description: Citation validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationValidationResult"
  /rag/answer:
    post:
      operationId: ragAnswer
      summary: Return confirmed answer or safe refusal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
      responses:
        "201":
          description: RAG answer guardrail result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationValidationResult"
  /templates:
    get:
      operationId: listTemplates
      summary: List document templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
  /documents/generate:
    post:
      operationId: generateDocument
      summary: Generate document draft from template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDocumentRequest"
      responses:
        "201":
          description: Generated draft document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDocument"
  /cases/{caseId}/generated-documents:
    get:
      operationId: listGeneratedDocuments
      summary: List generated documents for case
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedDocument"
  /subscriptions/current:
    get:
      operationId: getCurrentSubscription
      summary: Get current subscription and budget status
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
      responses:
        "200":
          description: Subscription budget status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetStatus"
  /usage/ai:
    post:
      operationId: recordAiUsage
      summary: Record AI usage without raw PII
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiUsageInput"
      responses:
        "201":
          description: Usage event and budget status
          content:
            application/json:
              schema:
                type: object
                required: [event, budget]
                properties:
                  event:
                    $ref: "#/components/schemas/AiUsageEvent"
                  budget:
                    $ref: "#/components/schemas/BudgetStatus"
  /admin/providers:
    get:
      operationId: listProviders
      summary: List AI providers and kill switches
      responses:
        "200":
          description: Provider configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderConfig"
    post:
      operationId: setProvider
      summary: Set provider kill switch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConfig"
      responses:
        "201":
          description: Provider config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, jurisdiction]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        jurisdiction:
          type: string
          enum: [KZ]
    RegisterRequest:
      type: object
      required: [channel, consentVersion]
      properties:
        channel:
          type: string
          enum: [phone, email]
        phone:
          type: string
          pattern: "^\\+7\\d{10}$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        consentVersion:
          type: string
    OtpChallenge:
      type: object
      required: [otpId, expiresAt, deliveryMode]
      properties:
        otpId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        deliveryMode:
          type: string
          enum: [stub, sms, email]
        testCode:
          type: string
          description: Present only in local/stub mode.
    VerifyOtpRequest:
      type: object
      required: [otpId, code]
      properties:
        otpId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 6
          maxLength: 6
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthUser:
      type: object
      required: [id, roles, consentVersion]
      properties:
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [guest, user, legal_expert, support_operator, admin, superadmin]
        consentVersion:
          type: string
    Session:
      type: object
      required: [id, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    CreateProfileRequest:
      type: object
      required: [userId, type, displayName]
      properties:
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [person, individual_entrepreneur, legal_entity, representative]
        displayName:
          type: string
        iinBin:
          type: string
          pattern: "^\\d{12}$"
        address:
          type: string
        bankAccount:
          type: string
    Profile:
      type: object
      required: [id, userId, type, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [person, individual_entrepreneur, legal_entity, representative]
        displayName:
          type: string
        iinBin:
          type: string
          description: Masked value only.
        address:
          type: string
        bankAccount:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, action, metadata, correlationId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actorUserId:
          type: string
        targetId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
    LegalCase:
      type: object
      required: [id, ownerUserId, title, problemText, category, confidence, status, readinessPercent, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
        profileId:
          type: string
        title:
          type: string
        problemText:
          type: string
        category:
          type: string
        subcategory:
          type: string
        confidence:
          type: number
        status:
          type: string
          enum: [consultation, clarification_required, collecting_documents, document_drafting, review_required]
        readinessPercent:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
    CreateCaseRequest:
      type: object
      required: [ownerUserId, problemText]
      properties:
        ownerUserId:
          type: string
        profileId:
          type: string
        problemText:
          type: string
          minLength: 10
    Message:
      type: object
      required: [id, caseId, role, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateMessageRequest:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
    CreateTranscriptRequest:
      type: object
      properties:
        caseId:
          type: string
        language:
          type: string
          enum: [ru, kk, en]
        audioRef:
          type: string
        text:
          type: string
    TranscriptJob:
      type: object
      required: [id, status, language, transcript, lowConfidenceFragments, createdAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
        status:
          type: string
          enum: [transcribing, classifying, retrieving_sources, validating, generating, review_required, ready, failed]
        language:
          type: string
          enum: [ru, kk, en]
        transcript:
          type: string
        lowConfidenceFragments:
          type: array
          items:
            type: string
        audioFileId:
          type: string
          format: uuid
        audioMimeType:
          type: string
        audioSizeBytes:
          type: integer
        audioSha256:
          type: string
        audioStorageKey:
          type: string
        progress:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    CreateUploadSessionRequest:
      type: object
      required: [caseId, fileName, mimeType, sizeBytes]
      properties:
        caseId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
    UploadSession:
      type: object
      required: [id, caseId, fileName, mimeType, sizeBytes, status, uploadUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        status:
          type: string
          enum: [upload_pending, quarantined, ocr_review_required, ready, rejected]
        uploadUrl:
          type: string
        createdAt:
          type: string
          format: date-time
    Document:
      type: object
      required: [id, caseId, fileName, mimeType, sizeBytes, sha256, status, extractedFields, createdAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        status:
          type: string
          enum: [upload_pending, quarantined, ocr_review_required, ready, rejected]
        extractedFields:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
    CreateEvidenceFolderRequest:
      type: object
      required: [caseId, title]
      properties:
        caseId:
          type: string
        title:
          type: string
        documentIds:
          type: array
          items:
            type: string
    EvidenceFolder:
      type: object
      required: [id, caseId, title, assessment, documentIds, createdAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
        title:
          type: string
        assessment:
          type: string
          enum: [relevant, possibly_admissible, insufficient, contradictory, unknown]
        documentIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    ManualLegalSourceImport:
      type: object
      required: [officialId, title, sourceType, authority, language, text, sourceUrl, effectiveFrom, sourceVersion, status]
      properties:
        officialId:
          type: string
        title:
          type: string
        sourceType:
          type: string
        authority:
          type: string
        language:
          type: string
          enum: [ru, kk, en]
        article:
          type: string
        point:
          type: string
        text:
          type: string
        sourceUrl:
          type: string
          format: uri
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
        sourceVersion:
          type: string
        status:
          type: string
          enum: [draft, active, expired, cancelled, blocked]
    LegalSourceFragment:
      allOf:
        - $ref: "#/components/schemas/ManualLegalSourceImport"
        - type: object
          required: [id, retrievedAt, checksum, embeddingVersion]
          properties:
            id:
              type: string
              format: uuid
            retrievedAt:
              type: string
              format: date-time
            checksum:
              type: string
            embeddingVersion:
              type: string
    CitationValidationRequest:
      type: object
      properties:
        fragmentId:
          type: string
        officialId:
          type: string
        article:
          type: string
        eventDate:
          type: string
          format: date-time
        quotedText:
          type: string
    CitationValidationResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [confirmed, invalid, insufficient_authoritative_sources]
        message:
          type: string
        requiredAction:
          type: string
          enum: [clarify_or_human_review]
