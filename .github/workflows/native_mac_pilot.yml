name: Native Mac Pilot

on:
  push:
    branches: [codex/mac-ci-pilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mac-ai-lawyer-kazakhstan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node:
    if: github.repository == 'milaniumkz/ai-lawyer-kazakhstan' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-ai-lawyer-kazakhstan"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "24"
          cache: npm
      - name: Select installed Mac Node 24
        if: github.event_name != 'pull_request'
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    if: github.repository == 'milaniumkz/ai-lawyer-kazakhstan' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-ai-lawyer-kazakhstan"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_CONFIG_FILE: /dev/null
      PIP_TRUSTED_HOST: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.11"
      - name: Isolated Mac Python 3.11 environment
        if: github.event_name != 'pull_request'
        run: |
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 -m venv "$RUNNER_TEMP/aizan-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "$RUNNER_TEMP/aizan-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e "services/ai[dev]"
      - run: PYTHONPATH=services/ai/app python -m unittest discover -s services/ai/app -p "*test*.py"

  flutter:
    if: github.repository == 'milaniumkz/ai-lawyer-kazakhstan' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-ai-lawyer-kazakhstan"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'pull_request'
        with:
          flutter-version: "3.41.1"
          channel: stable
      - name: Select installed Mac Flutter
        if: github.event_name != 'pull_request'
        run: |
          echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
          /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'
      - run: flutter pub get ${{ github.event_name != 'pull_request' && '--enforce-lockfile' || '' }}
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test --exclude-tags golden
        working-directory: apps/mobile

