name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      repair_ai_schema:
        description: Apply the additive AI conversation migration without reinstalling the app
        type: boolean
        default: false
      verify_only:
        description: Verify the existing deployed site without reinstalling it
        type: boolean
        default: false
      inspect_sources:
        description: Read-only diagnosis of official text retrieval on the server
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-lawyer-server-deploy
  cancel-in-progress: false

jobs:
  inspect-official-sources:
    if: inputs.inspect_sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official text reader without accessing credentials or customer data
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/ai-lawyer-kz
          chmod 600 ~/.ssh/ai-lawyer-kz
          ssh-keyscan -p "${SERVER_SSH_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'node -' <<'JS'
          const fs=require('node:fs');const path=require('node:path');const Module=require('node:module');
          const filename='/opt/ai-lawyer-kz/app/services/api/dist/modules/legal/openai-conversation.adapter.js';
          const diagnostic=new Module(filename,module);diagnostic.filename=filename;diagnostic.paths=Module._nodeModulePaths(path.dirname(filename));
          diagnostic._compile(fs.readFileSync(filename,'utf8')+'\nexports.inspectOfficialText=readOfficialText;',filename);
          (async()=>{
            for(const host of ['adilet.zan.kz','old.adilet.zan.kz']){
              const url=`https://${host}/rus/docs/K990000409_`;
              const started=Date.now();
              const page=await diagnostic.exports.inspectOfficialText(url);
              console.log('OFFICIAL_READER '+JSON.stringify({host,elapsedMs:Date.now()-started,resolvedHost:page?new URL(page.url).hostname:null,characters:page?.text.length||0,loanQuotePresent:page?.text.includes('договор займа считается заключенным')||false,returnQuotePresent:page?.text.includes('заемщик обязан возвратить предмет займа')||false}));
            }
            const response=await fetch('https://old.adilet.zan.kz/rus/docs/K990000409_', {signal:AbortSignal.timeout(30000)});
            const text=await response.text();
            console.log('OFFICIAL_HTTP '+JSON.stringify({status:response.status,type:response.headers.get('content-type'),characters:text.length,closedHtml:/<\/html>/i.test(text),article717Present:/717/.test(text),tail:text.replace(/<[^>]+>/g,' ').slice(-160)}));
          })().catch(error=>{console.error(error.name);process.exitCode=1;});
          JS
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ai-lawyer-kz

  verify-deployed:
    if: inputs.verify_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed manual document workflow
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
          WEB_TEST_SECURE_AUTH: "1"
        run: npm run test:web-intake
      - name: Verify live OpenAI conversation and source-backed claim
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: node scripts/web/check-openai-conversation.mjs

  repair-ai-schema:
    if: inputs.repair_ai_schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Back up and apply additive AI schema migration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/ai-lawyer-kz
          chmod 600 ~/.ssh/ai-lawyer-kz
          ssh-keyscan -p "${SERVER_SSH_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'bash /opt/ai-lawyer-kz/app/scripts/deploy/server-backup-postgres.sh'
          ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'sudo -u postgres psql -d ai_lawyer_kz -v ON_ERROR_STOP=1' < infra/db/migrations/0013_ai_conversation.sql
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ai-lawyer-kz

  deploy:
    if: ${{ !inputs.repair_ai_schema && !inputs.verify_only && !inputs.inspect_sources }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e services/ai Pillow

      - run: npm ci

      - name: Build release package
        run: npm run deploy:package -- /tmp/ai-lawyer-kz.tar.gz

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          test -n "$SERVER_HOST" || { echo 'SERVER_HOST is missing'; exit 1; }
          test -n "$SERVER_SSH_PRIVATE_KEY" || { echo 'SERVER_SSH_PRIVATE_KEY is missing'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/ai-lawyer-kz
          chmod 600 ~/.ssh/ai-lawyer-kz
          ssh-keyscan -T 15 -p "${SERVER_SSH_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          test -n "$SERVER_USER" || { echo 'SERVER_USER is missing'; exit 1; }
          (cd /tmp && sha256sum ai-lawyer-kz.tar.gz > ai-lawyer-kz.tar.gz.sha256)
          scp -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/ai-lawyer-kz -P "${SERVER_SSH_PORT:-22}" /tmp/ai-lawyer-kz.tar.gz /tmp/ai-lawyer-kz.tar.gz.sha256 "$SERVER_USER@$SERVER_HOST:/opt/"

      - name: Install on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt
          sha256sum -c ai-lawyer-kz.tar.gz.sha256
          test -f /etc/ai-lawyer-api.env
          previous_app_inode=$(stat -c %i /opt/ai-lawyer-kz/app)
          bash /opt/ai-lawyer-kz/app/scripts/deploy/server-backup-postgres.sh
          if ! bash /opt/ai-lawyer-kz/app/scripts/deploy/server-install.sh /opt/ai-lawyer-kz.tar.gz; then
            current_app_inode=$(stat -c %i /opt/ai-lawyer-kz/app 2>/dev/null || true)
            if [ "$current_app_inode" != "$previous_app_inode" ] && [ -d /opt/ai-lawyer-kz/app.prev ]; then
              if [ -e /opt/ai-lawyer-kz/app ]; then
                mv /opt/ai-lawyer-kz/app "/opt/ai-lawyer-kz/app.failed.$(date -u +%Y%m%dT%H%M%SZ)"
              fi
              mv /opt/ai-lawyer-kz/app.prev /opt/ai-lawyer-kz/app
              systemctl restart ai-lawyer-web ai-lawyer-admin ai-lawyer-api ai-lawyer-ai
              bash /opt/ai-lawyer-kz/app/scripts/deploy/server-health-check.sh
            fi
            exit 1
          fi
          python3 /opt/ai-lawyer-kz/app/scripts/deploy/server-ai-status.py
          REMOTE

      - name: Public health check
        env:
          PUBLIC_SERVER_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: |
          test -n "$PUBLIC_SERVER_URL" || { echo 'PUBLIC_SERVER_URL is missing'; exit 1; }
          npm run release-check:server
          curl --fail --silent --show-error "$PUBLIC_SERVER_URL/aizan/home.png" -o /tmp/deployed-home.png
          cmp apps/web/public/aizan/home.png /tmp/deployed-home.png
          curl --fail --silent --show-error "$PUBLIC_SERVER_URL/" -o /tmp/deployed-web.html
          grep -q 'aizanArt-authBrand' /tmp/deployed-web.html

      - name: Verify deployed intake in browser
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
          WEB_TEST_SECURE_AUTH: "1"
        run: |
          npx playwright install --with-deps chromium
          npm run test:web-intake

      - name: Verify live OpenAI conversation and source-backed claim
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: node scripts/web/check-openai-conversation.mjs

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ai-lawyer-kz
