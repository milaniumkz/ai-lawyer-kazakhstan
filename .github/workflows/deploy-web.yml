name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      repair_ai_schema:
        description: Apply the additive AI conversation migration without reinstalling the app
        type: boolean
        default: false
      verify_only:
        description: Verify the existing deployed site without reinstalling it
        type: boolean
        default: false
      ios_preview_first:
        description: First native preview index (1-23)
        type: string
        default: "1"
      ios_preview_last:
        description: Last native preview index (1-23)
        type: string
        default: "23"
      ios_build_only:
        description: Build an unsigned iOS candidate and native iPhone previews for review
        type: boolean
        default: false
      visual_only:
        description: Verify manual workflows and all responsive pages for a visual-only release; skip unrelated live OpenAI checks
        type: boolean
        default: false
      inspect_sources:
        description: Read-only diagnosis of official text retrieval on the server
        type: boolean
        default: false
      verify_legal_recovery:
        description: Verify real OpenAI web recovery and court drafts using synthetic in-memory data
        type: boolean
        default: false
      qa_revoke_user_ids:
        description: Optional comma-separated synthetic intake QA user UUIDs to revoke after an interrupted check
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ inputs.ios_build_only && 'ai-lawyer-ios-build' || (inputs.inspect_sources || inputs.verify_legal_recovery) && 'ai-lawyer-source-inspection' || 'ai-lawyer-server-deploy' }}
  cancel-in-progress: false

jobs:
  ios-candidate:
    if: inputs.ios_build_only
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Check configured Apple access without exposing credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node -e 'console.log(JSON.stringify({appStorePrivateKeyConfigured:Boolean(process.env.ASC_PRIVATE_KEY),keyIdConfigured:Boolean(process.env.ASC_KEY_ID),issuerConfigured:Boolean(process.env.ASC_ISSUER_ID)}))'
      - name: Build unsigned release candidate with the new AIZAN icon
        if: inputs.ios_preview_first == '1'
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter build ios --release --no-codesign --build-name=1.0.2 --build-number=8 --dart-define=API_BASE_URL=https://89-207-250-217.sslip.io
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app "$RUNNER_TEMP/aizan-ios-unsigned.app.zip"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist
          sips -g pixelWidth -g pixelHeight ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
      - name: Capture all native screens in the iPhone simulator
        env:
          IOS_PREVIEW_FIRST: ${{ inputs.ios_preview_first }}
          IOS_PREVIEW_LAST: ${{ inputs.ios_preview_last }}
          IOS_SCREENSHOT_DIR: ${{ runner.temp }}/aizan-native-previews
        run: |
          export FLUTTER_BIN="$(command -v flutter)"
          node scripts/mobile/capture-ios-simulator-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aizan-ios-candidate-and-previews
          path: |
            ${{ runner.temp }}/aizan-ios-unsigned.app.zip
            ${{ runner.temp }}/aizan-native-previews
          if-no-files-found: warn
          retention-days: 14

  inspect-official-sources:
    if: inputs.inspect_sources || inputs.verify_legal_recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official text reader without accessing credentials or customer data
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          INSPECT_SOURCES: ${{ inputs.inspect_sources }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/ai-lawyer-kz
          chmod 600 ~/.ssh/ai-lawyer-kz
          ssh-keyscan -p "${SERVER_SSH_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts
          if [ "$INSPECT_SOURCES" = "true" ]; then
          ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'node -' <<'JS'
          const fs=require('node:fs');const path=require('node:path');const Module=require('node:module');
          const filename='/opt/ai-lawyer-kz/app/services/api/dist/modules/legal/official-sources.js';
          const diagnostic=new Module(filename,module);diagnostic.filename=filename;diagnostic.paths=Module._nodeModulePaths(path.dirname(filename));
          diagnostic._compile(fs.readFileSync(filename,'utf8')+'\nexports.inspectOfficialText=readOfficialText;',filename);
          (async()=>{
            const {searchOfficialCatalogue}=require('/opt/ai-lawyer-kz/app/services/api/dist/modules/legal/official-catalogue.js');
            const urls=await searchOfficialCatalogue(['Гражданский кодекс Республики Казахстан (Особенная часть)'],AbortSignal.timeout(30000));
            for(const url of urls){
              const page=await diagnostic.exports.inspectOfficialText(url);
              console.log('OFFICIAL_CATALOGUE_READER '+JSON.stringify({url,title:page?.title,characters:page?.text.length,edition:page?.editionDate,unavailable:page?.unavailable,
                loanExcerpt:page?.text.match(/статья 715[\s\S]{0,1400}/i)?.[0],returnExcerpt:page?.text.match(/статья 722[\s\S]{0,1400}/i)?.[0]}));
            }
            for(const host of ['adilet.zan.kz','old.adilet.zan.kz','law.gov.kz','zan.gov.kz']){
              const url=['law.gov.kz','zan.gov.kz'].includes(host) ? `https://${host}/client/` : `https://${host}/rus/docs/K990000409_`;
              const started=Date.now();
              const page=await diagnostic.exports.inspectOfficialText(url);
              console.log('OFFICIAL_READER '+JSON.stringify({host,elapsedMs:Date.now()-started,resolvedHost:page?new URL(page.url).hostname:null,characters:page?.text.length||0,loanQuotePresent:page?.text.includes('договор займа считается заключенным')||false,returnQuotePresent:page?.text.includes('заемщик обязан возвратить предмет займа')||false}));
            }
            await Promise.all(['https://law.gov.kz/','https://zan.gov.kz/','https://www.gov.kz/'].map(async url=>{
              try {const response=await fetch(url,{signal:AbortSignal.timeout(10000)});console.log('OFFICIAL_CONNECTIVITY '+JSON.stringify({host:new URL(url).hostname,status:response.status}));await response.body?.cancel();}
              catch(error){console.log('OFFICIAL_CONNECTIVITY '+JSON.stringify({host:new URL(url).hostname,error:error.name,cause:error.cause?.code}));}
            }));
            try {
            const response=await fetch('https://old.adilet.zan.kz/rus/docs/K990000409_', {signal:AbortSignal.timeout(10000)});
            const text=await response.text();
            console.log('OFFICIAL_HTTP '+JSON.stringify({status:response.status,type:response.headers.get('content-type'),characters:text.length,closedHtml:/<\/html>/i.test(text),article717Present:/717/.test(text),tail:text.replace(/<[^>]+>/g,' ').slice(-160)}));
            } catch(error) {console.log('OFFICIAL_HTTP '+JSON.stringify({available:false,error:error.name}));}
          })().catch(error=>{console.error(error.name);process.exitCode=1;});
          JS
          fi
      - name: Verify actual OpenAI source recovery and court draft
        if: inputs.verify_legal_recovery
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          QA_REVOKE_USER_IDS: ${{ inputs.qa_revoke_user_ids }}
        run: |
          if [ -n "$QA_REVOKE_USER_IDS" ]; then
            [[ "$QA_REVOKE_USER_IDS" =~ ^[0-9a-fA-F,-]+$ ]] || exit 1
            ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "cd /opt/ai-lawyer-kz/app && node --env-file=/etc/ai-lawyer-api.env scripts/release/revoke-qa-sessions.mjs '$QA_REVOKE_USER_IDS'"
          fi
          scp -i ~/.ssh/ai-lawyer-kz -P "${SERVER_SSH_PORT:-22}" scripts/release/verify-legal-recovery.mjs "$SERVER_USER@$SERVER_HOST:/tmp/aizan-legal-probe.mjs"
          ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'cd /opt/ai-lawyer-kz/app && AIZAN_PROBE_APP_ROOT=file:///opt/ai-lawyer-kz/app/ node --env-file=/etc/ai-lawyer-api.env --input-type=module -' <<'JS'
          const actual=globalThis.fetch;
          globalThis.fetch=async(url,options)=>{
            const ai=String(url).endsWith('/responses');
            const schema=ai ? JSON.parse(options?.body || '{}').text?.format?.name : undefined;
            const host=new URL(url).hostname;
            const path=new URL(url).pathname;
            const start=Date.now();
            let response;
            try {response=await actual(url,options);}
            catch(error){console.log('LEGAL_PROBE_TRANSPORT '+JSON.stringify({host,path,schema,elapsedMs:Date.now()-start,error:error.name,cause:error.cause?.code}));throw error;}
            if(ai){
              const body=await response.clone().json().catch(()=>({}));
              let citations=[],actQueries=[];
              try {const result=JSON.parse(body.output_text || body.output?.flatMap(item=>item.content || []).map(item=>item.text || '').join('') || '{}');citations=result.citations || [];actQueries=result.actSearchQueries || [];}catch{}
              console.log('LEGAL_PROBE_PROVIDER '+JSON.stringify({schema,actQueries,status:response.status,elapsedMs:Date.now()-start,completion:body.status,providerCode:body.error?.code,providerParam:body.error?.param,incompleteReason:body.incomplete_details?.reason,outputTokens:body.usage?.output_tokens,webActions:body.output?.filter(item=>item.type==='web_search_call').map(item=>({type:item.action?.type,status:item.status,sourceHosts:[...new Set((item.action?.sources || []).map(source=>{try{return new URL(source.url).hostname;}catch{return 'invalid';}}))]})),candidates:citations.map(source=>({host:(()=>{try{return new URL(source.url).hostname;}catch{return 'invalid';}})(),path:(()=>{try{const url=new URL(source.url);return url.pathname+(/^#!?\/doc\/\d/.test(url.hash) ? url.hash : '');}catch{return 'invalid';}})(),article:source.article,quoteCharacters:source.quote?.length,date:source.effectiveDate}))}));
            }else console.log('LEGAL_PROBE_SOURCE '+JSON.stringify({host,status:response.status,type:response.headers.get('content-type'),elapsedMs:Date.now()-start}));
            return response;
          };
          try {await import('file:///tmp/aizan-legal-probe.mjs');}
          finally {await (await import('node:fs/promises')).unlink('/tmp/aizan-legal-probe.mjs').catch(()=>{});}
          JS
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ai-lawyer-kz

  verify-deployed:
    if: inputs.verify_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify deployed manual document workflow
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
          WEB_TEST_SECURE_AUTH: "1"
        run: npm run test:web-intake
      - name: Verify composer above mobile keyboards
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: node scripts/web/check-chat-keyboard.mjs
      - name: Verify account and support actions through the deployed UI
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: npm run test:web-actions
      - name: Verify deployed responsive pages
        if: inputs.visual_only
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: npm run test:web-responsive
      - name: Verify live OpenAI conversation and source-backed claim
        if: ${{ !inputs.visual_only }}
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: node scripts/web/check-openai-conversation.mjs

  repair-ai-schema:
    if: inputs.repair_ai_schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Back up and apply additive AI schema migration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/ai-lawyer-kz
          chmod 600 ~/.ssh/ai-lawyer-kz
          ssh-keyscan -p "${SERVER_SSH_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'bash /opt/ai-lawyer-kz/app/scripts/deploy/server-backup-postgres.sh'
          ssh -o BatchMode=yes -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'sudo -u postgres psql -d ai_lawyer_kz -v ON_ERROR_STOP=1' < infra/db/migrations/0013_ai_conversation.sql
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ai-lawyer-kz

  deploy:
    if: ${{ !inputs.repair_ai_schema && !inputs.verify_only && !inputs.inspect_sources && !inputs.verify_legal_recovery && !inputs.ios_build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e services/ai Pillow

      - run: npm ci

      - name: Install public-law PDF text reader
        run: if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi

      - name: Build release package
        run: npm run deploy:package -- /tmp/ai-lawyer-kz.tar.gz

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          test -n "$SERVER_HOST" || { echo 'SERVER_HOST is missing'; exit 1; }
          test -n "$SERVER_SSH_PRIVATE_KEY" || { echo 'SERVER_SSH_PRIVATE_KEY is missing'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/ai-lawyer-kz
          chmod 600 ~/.ssh/ai-lawyer-kz
          ssh-keyscan -T 15 -p "${SERVER_SSH_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          test -n "$SERVER_USER" || { echo 'SERVER_USER is missing'; exit 1; }
          (cd /tmp && sha256sum ai-lawyer-kz.tar.gz > ai-lawyer-kz.tar.gz.sha256)
          scp -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/ai-lawyer-kz -P "${SERVER_SSH_PORT:-22}" /tmp/ai-lawyer-kz.tar.gz /tmp/ai-lawyer-kz.tar.gz.sha256 "$SERVER_USER@$SERVER_HOST:/opt/"

      - name: Install on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/ai-lawyer-kz -p "${SERVER_SSH_PORT:-22}" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt
          sha256sum -c ai-lawyer-kz.tar.gz.sha256
          test -f /etc/ai-lawyer-api.env
          previous_app_inode=$(stat -c %i /opt/ai-lawyer-kz/app)
          bash /opt/ai-lawyer-kz/app/scripts/deploy/server-backup-postgres.sh
          if ! command -v pdftotext >/dev/null; then apt-get update && apt-get install -y poppler-utils; fi
          if ! bash /opt/ai-lawyer-kz/app/scripts/deploy/server-install.sh /opt/ai-lawyer-kz.tar.gz; then
            current_app_inode=$(stat -c %i /opt/ai-lawyer-kz/app 2>/dev/null || true)
            if [ "$current_app_inode" != "$previous_app_inode" ] && [ -d /opt/ai-lawyer-kz/app.prev ]; then
              if [ -e /opt/ai-lawyer-kz/app ]; then
                mv /opt/ai-lawyer-kz/app "/opt/ai-lawyer-kz/app.failed.$(date -u +%Y%m%dT%H%M%SZ)"
              fi
              mv /opt/ai-lawyer-kz/app.prev /opt/ai-lawyer-kz/app
              systemctl restart ai-lawyer-web ai-lawyer-admin ai-lawyer-api ai-lawyer-ai
              bash /opt/ai-lawyer-kz/app/scripts/deploy/server-health-check.sh
            fi
            exit 1
          fi
          python3 /opt/ai-lawyer-kz/app/scripts/deploy/server-ai-status.py
          REMOTE

      - name: Public health check
        env:
          PUBLIC_SERVER_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: |
          test -n "$PUBLIC_SERVER_URL" || { echo 'PUBLIC_SERVER_URL is missing'; exit 1; }
          npm run release-check:server
          curl --fail --silent --show-error "$PUBLIC_SERVER_URL/aizan/home.png" -o /tmp/deployed-home.png
          cmp apps/web/public/aizan/home.png /tmp/deployed-home.png
          curl --fail --silent --show-error "$PUBLIC_SERVER_URL/" -o /tmp/deployed-web.html
          grep -q 'aizanArt-authBrand' /tmp/deployed-web.html

      - name: Verify deployed intake in browser
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
          WEB_TEST_SECURE_AUTH: "1"
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:web-intake

      - name: Verify composer above mobile keyboards
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: node scripts/web/check-chat-keyboard.mjs
      - name: Verify account and support actions through the deployed UI
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: npm run test:web-actions
      - name: Verify deployed responsive pages
        if: inputs.visual_only
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: npm run test:web-responsive
      - name: Verify live OpenAI conversation and source-backed claim
        if: ${{ !inputs.visual_only }}
        env:
          WEB_BASE_URL: ${{ secrets.PUBLIC_SERVER_URL }}
        run: node scripts/web/check-openai-conversation.mjs

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ai-lawyer-kz
